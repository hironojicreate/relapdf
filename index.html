<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>RelaPDF</title>
<meta name="description" content="写真をPDFに、PDFの結合・ページ整理も。ブラウザの中だけで動き、ファイルは端末の外に出ません。">
<meta name="theme-color" content="#2f6df6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RelaPDF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --text: #1c2330;
  --text-muted: #5d6778;
  --border: #d9dee6;
  --accent: #2f6df6;
  --accent-text: #ffffff;
  --accent-soft: #e6eeff;
  --danger: #d33a3a;
  --success: #1f9d55;
  --success-soft: #e3f6ea;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 2px 8px rgba(20, 30, 50, .06);
  --radius: 12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b;
    --surface: #1b2029;
    --surface-2: #242a35;
    --text: #e8ecf2;
    --text-muted: #9aa4b5;
    --border: #333b48;
    --accent: #5b8cff;
    --accent-text: #0b1020;
    --accent-soft: #1f2b47;
    --danger: #ff6b6b;
    --success: #4cd38a;
    --success-soft: #173826;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 8px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b;
  --surface: #1b2029;
  --surface-2: #242a35;
  --text: #e8ecf2;
  --text-muted: #9aa4b5;
  --border: #333b48;
  --accent: #5b8cff;
  --accent-text: #0b1020;
  --accent-soft: #1f2b47;
  --danger: #ff6b6b;
  --success: #4cd38a;
  --success-soft: #173826;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 8px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* 画面の下に固定したバーの裏に、操作中の部品が隠れないようにする */
html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: 110px; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
}
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
body.mode-easy .detail-only, body.mode-detail .easy-only { display: none !important; }

/* ---- ヘッダー ---- */
.app-header {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .02em; }
.brand img { display: block; border-radius: 7px; }
.segmented { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); }
.segmented button {
  border: 0; background: transparent; padding: 6px 14px; border-radius: 999px;
  font-size: 14px; color: var(--text-muted); cursor: pointer; min-height: 36px;
}
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

/* ---- ボタン ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); cursor: pointer;
  font-weight: 600; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.big { min-height: 64px; font-size: 18px; border-radius: 14px; padding: 0 24px; }
.btn.subtle { background: transparent; border-color: transparent; color: var(--text-muted); font-weight: 500; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 20px; height: 20px; flex: none; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

/* ---- 最初の画面 ---- */
main { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 16px; }
.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 48px 16px; margin-top: 4vh;
  border: 2px dashed var(--border); border-radius: 20px; background: var(--surface);
}
body.mode-easy .empty { border-style: solid; border-width: 1px; }
.empty h2 { margin: 0 0 6px; font-size: 22px; }
.empty .lead { margin: 0 0 24px; color: var(--text-muted); }
.empty-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; }
body.mode-easy .empty-actions { flex-direction: column; max-width: 360px; }
.privacy { margin: 24px 0 0; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.privacy svg { width: 16px; height: 16px; }

/* ---- ページ一覧 ---- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.toolbar .count { font-weight: 600; }
.toolbar [data-action="clear"] { margin-right: auto; padding: 0 10px; }
.page-grid {
  list-style: none; margin: 0; padding: 0;
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
}
body.mode-easy .page-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.page-card {
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.thumb { position: relative; aspect-ratio: 1; background: var(--surface-2); }
/* 正方形の枠に収める。枠が正方形なので、90度回転しても枠からはみ出さない */
.thumb img, .thumb .blank, .thumb .spinner {
  position: absolute; inset: 0; margin: auto;
}
.thumb img, .thumb .blank {
  max-width: calc(100% - 20px); max-height: calc(100% - 20px); display: block;
  background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
  transition: transform .2s ease;
}
.thumb .blank { height: calc(100% - 20px); aspect-ratio: 210 / 297; }
.page-no {
  position: absolute; left: 8px; top: 8px; z-index: 1; min-width: 26px; height: 26px; padding: 0 7px;
  border-radius: 13px; background: var(--accent); color: var(--accent-text);
  font-size: 13px; font-weight: 700; display: grid; place-items: center;
}
.page-src { padding: 6px 10px 0; font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-actions { display: flex; justify-content: space-between; padding: 4px; }
.icon-btn {
  display: grid; place-items: center; width: 44px; height: 40px;
  border: 0; border-radius: 8px; background: transparent; color: var(--text-muted); cursor: pointer;
}
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.icon-btn.danger:hover:not(:disabled) { color: var(--danger); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.icon-btn svg { width: 20px; height: 20px; }

/* ---- 手順（かんたんモード） ---- */
.steps {
  display: flex; justify-content: center; gap: 4px; list-style: none; margin: 0; padding: 10px 16px 0;
  font-size: 13px; color: var(--text-muted);
}
.steps li { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; }
.steps li + li::before { content: ""; width: 14px; height: 1px; background: var(--border); margin-right: 6px; }
.steps .num {
  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); font-weight: 700; font-size: 12px;
}
.steps li[aria-current="step"] { color: var(--text); font-weight: 700; }
.steps li[aria-current="step"] .num { background: var(--accent); color: var(--accent-text); }

/* ---- ドラッグでの並べ替え ---- */
.grip { touch-action: none; cursor: grab; }
body.mode-detail .thumb { cursor: grab; }
.page-card.dragging {
  position: relative; z-index: 20; opacity: .92; cursor: grabbing;
  box-shadow: 0 12px 32px rgba(20, 30, 50, .28); transition: none;
}
.page-grid.is-dragging { user-select: none; -webkit-user-select: none; }
.page-card.drop-before, .page-card.drop-after { position: relative; }
.page-card.drop-before::before, .page-card.drop-after::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 4px; border-radius: 2px; background: var(--accent);
}
.page-card.drop-before::before { left: -8px; }
.page-card.drop-after::after { right: -8px; }

/* ---- 確認画面の「保存へ進む」 ---- */
.next-bar {
  position: sticky; bottom: 0; z-index: 10;
  padding: 12px 16px calc(12px + var(--safe-bottom));
  background: var(--surface); border-top: 1px solid var(--border);
  box-shadow: 0 -4px 16px rgba(20, 30, 50, .06);
}
.next-bar .btn { width: 100%; max-width: 560px; display: flex; margin: 0 auto; min-height: 54px; font-size: 17px; }
body.mode-detail .next-bar { display: none !important; }

/* ---- 書き出し ---- */
.export-bar {
  position: sticky; bottom: 0; z-index: 10;
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px;
  padding: 12px 16px calc(12px + var(--safe-bottom));
  background: var(--surface); border-top: 1px solid var(--border);
  box-shadow: 0 -4px 16px rgba(20, 30, 50, .06);
}
.export-bar .inner { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--text-muted); }
.field input, .field select {
  min-height: 44px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px;
}
.field.grow { flex: 1 1 220px; }
.field.grow input { width: 100%; }
.export-bar .btn.primary { margin-left: auto; min-width: 140px; }
/* かんたんモードの「3 保存」では、画面の中央にカードとして出す */
body.mode-easy[data-step="save"] main { display: none; }
body.mode-easy .export-bar {
  position: static; flex: 1; align-items: flex-start; background: transparent; border: 0; box-shadow: none;
  padding: 16px 16px calc(24px + var(--safe-bottom));
}
body.mode-easy .export-bar .inner {
  max-width: 560px; padding: 20px; gap: 16px; border-radius: 20px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
}
.save-head { width: 100%; }
.save-head .back { margin: -8px 0 4px -10px; padding: 0 10px; min-height: 36px; }
.save-head h2 { margin: 0; font-size: 22px; }
.save-head p { margin: 2px 0 0; color: var(--text-muted); font-size: 14px; }
body.mode-easy .export-bar .field { font-size: 13px; }
body.mode-easy .export-bar .field.grow { flex-basis: 100%; }
body.mode-easy .export-bar .field:not(.grow) { flex: 1 1 90px; }
body.mode-easy .export-bar .btn.primary { flex: 1 1 100%; min-height: 56px; font-size: 18px; margin-left: 0; }

/* ---- ダイアログ・お知らせ ---- */
dialog {
  border: 0; border-radius: 18px; padding: 24px; width: min(420px, calc(100vw - 32px));
  background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
}
dialog::backdrop { background: rgba(10, 15, 25, .45); }
dialog h2 { margin: 0 0 4px; font-size: 20px; }
dialog .meta { margin: 0 0 20px; color: var(--text-muted); font-size: 14px; word-break: break-all; }
dialog .actions { display: flex; flex-direction: column; gap: 10px; }
.done { text-align: center; }
.done-icon {
  width: 64px; height: 64px; margin: 4px auto 12px; border-radius: 50%;
  display: grid; place-items: center; background: var(--success-soft); color: var(--success);
}
.done-icon svg { width: 34px; height: 34px; }
.done .actions { margin-top: 4px; }
.busy {
  position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 12px;
  background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(2px);
}
.busy p { margin: 0; font-weight: 600; }
.spinner {
  width: 40px; height: 40px; border-radius: 50%;
  border: 4px solid var(--accent-soft); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
.thumb .spinner { width: 28px; height: 28px; border-width: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + var(--safe-bottom)); transform: translateX(-50%); z-index: 60;
  max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 12px;
  background: var(--text); color: var(--bg); box-shadow: var(--shadow); font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
.toast.error { background: var(--danger); color: #fff; }
.drop-overlay {
  position: fixed; inset: 12px; z-index: 40; display: grid; place-items: center;
  border: 3px dashed var(--accent); border-radius: 20px;
  background: color-mix(in srgb, var(--accent-soft) 85%, transparent);
  font-size: 22px; font-weight: 700; color: var(--accent); pointer-events: none;
}
/* ---- アプリ内カメラ ---- */
.camera {
  position: fixed; inset: 0; z-index: 70; background: #000; color: #fff;
  display: flex; flex-direction: column;
}
body.camera-open { overflow: hidden; }
.camera video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.camera::after { content: ""; position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.camera.flash::after { animation: flash .18s ease-out; }
@keyframes flash { from { opacity: .7; } to { opacity: 0; } }
.camera-top {
  position: relative; display: flex; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
}
.camera-count {
  padding: 4px 14px; border-radius: 999px; background: rgba(0, 0, 0, .55);
  font-weight: 700; font-size: 15px;
}
.camera-error {
  position: relative; margin: auto 24px; padding: 20px; border-radius: 16px;
  background: rgba(30, 34, 42, .92); text-align: center; display: grid; gap: 14px;
}
.camera-error p { margin: 0; line-height: 1.7; }
.camera-bottom {
  position: relative; margin-top: auto;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
  padding: 20px 24px calc(env(safe-area-inset-bottom, 0px) + 24px);
  background: linear-gradient(to top, rgba(0, 0, 0, .6), transparent);
}
.camera-last-wrap { justify-self: start; width: 56px; height: 56px; }
.camera-last { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; border: 2px solid #fff; display: block; }
.shutter {
  width: 76px; height: 76px; border-radius: 50%; cursor: pointer;
  border: 5px solid #fff; background: rgba(255, 255, 255, .9); box-shadow: inset 0 0 0 3px #000;
}
.shutter:active:not(:disabled) { transform: scale(.94); }
.shutter:disabled { opacity: .4; cursor: default; }
.camera-done {
  justify-self: end; min-width: 76px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 0;
  background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer;
}
/* 横向きのときは、ボタンを右側に縦に並べる */
@media (orientation: landscape) and (max-height: 500px) {
  .camera-bottom {
    position: absolute; right: 0; top: 0; bottom: 0; margin: 0;
    grid-template-columns: auto; grid-template-rows: 1fr auto 1fr; justify-items: center;
    padding: 16px calc(env(safe-area-inset-right, 0px) + 20px) 16px 20px;
    background: linear-gradient(to left, rgba(0, 0, 0, .6), transparent);
  }
  .camera-last-wrap { justify-self: center; align-self: start; }
  .camera-done { justify-self: center; align-self: end; }
}

/* ---- バージョン表示（画面右下。下のバーが出ているときは、その上に出す） ---- */
.app-version {
  position: fixed; right: 12px; z-index: 30; pointer-events: none;
  bottom: calc(var(--bottom-bar, 0px) + var(--safe-bottom) + 6px);
  font-size: 12px; letter-spacing: .02em; color: var(--text-muted); opacity: .75;
}
body.has-bottom-bar .app-version { bottom: calc(var(--bottom-bar, 0px) + 6px); }

@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2s; }
  .thumb img { transition: none; }
}
</style>
<script type="module" src="src/app/main.js"></script>
</head>
<body class="mode-detail">
<header class="app-header">
  <h1 class="brand"><img src="icons/icon.svg" alt="" width="28" height="28">RelaPDF</h1>
  <div class="segmented" role="group" aria-label="モードの切り替え">
    <button type="button" data-mode="easy" aria-pressed="false">かんたん</button>
    <button type="button" data-mode="detail" aria-pressed="true">詳細</button>
  </div>
</header>

<ol id="steps" class="steps easy-only" aria-label="手順">
  <li data-step="capture"><span class="num">1</span>撮る・選ぶ</li>
  <li data-step="confirm"><span class="num">2</span>確認</li>
  <li data-step="save"><span class="num">3</span>保存</li>
</ol>

<main>
  <section id="empty" class="empty">
    <h2 class="easy-only">写真をPDFに</h2>
    <h2 class="detail-only">PDFを作る・まとめる</h2>
    <p class="lead easy-only">続けて何枚でも撮れます。順番を確認して保存します。</p>
    <p class="lead detail-only">PDFや画像をここにドロップするか、ファイルを選んでください。</p>
    <div class="empty-actions">
      <button type="button" class="btn primary big easy-only" data-action="camera">カメラで撮る</button>
      <button type="button" class="btn big easy-only" data-action="pick-photos">写真を選ぶ</button>
      <button type="button" class="btn primary big detail-only" data-action="pick-files">ファイルを選ぶ</button>
      <button type="button" class="btn subtle easy-only" data-action="os-camera">端末のカメラアプリで撮る</button>
    </div>
    <p class="privacy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      ファイルは端末の外に出ません
    </p>
  </section>

  <section id="workspace" hidden>
    <div class="toolbar">
      <span class="count" id="page-count"></span>
      <button type="button" class="btn subtle" data-action="clear">すべて削除</button>
      <button type="button" class="btn easy-only" data-action="camera">撮る</button>
      <button type="button" class="btn easy-only" data-action="pick-photos">選ぶ</button>
      <button type="button" class="btn detail-only" data-action="pick-files">ファイルを追加</button>
    </div>
    <ol id="page-grid" class="page-grid" aria-label="ページの一覧"></ol>
  </section>
</main>

<footer id="next-bar" class="next-bar" hidden>
  <button type="button" class="btn primary" data-action="go-save">保存へ進む<span id="next-count"></span></button>
</footer>

<footer id="export-bar" class="export-bar" hidden>
  <div class="inner">
    <div class="save-head easy-only">
      <button type="button" class="btn subtle back" data-action="back-to-confirm">‹ 確認に戻る</button>
      <h2>保存する</h2>
      <p id="save-summary"></p>
    </div>
    <label class="field grow">ファイル名
      <input id="file-name" type="text" autocomplete="off" enterkeyhint="done">
    </label>
    <label class="field">写真の用紙
      <select id="paper">
        <option value="a4">A4</option>
        <option value="image">写真のサイズ</option>
      </select>
    </label>
    <label class="field">画質
      <select id="quality">
        <option value="standard">標準</option>
        <option value="high">高画質</option>
      </select>
    </label>
    <button type="button" class="btn primary" data-action="export">PDFを作成</button>
  </div>
</footer>

<div id="camera" class="camera" hidden role="dialog" aria-modal="true" aria-label="カメラ">
  <video id="camera-video" playsinline muted autoplay></video>
  <div class="camera-top">
    <span class="camera-count" id="camera-count" aria-live="polite">0枚</span>
  </div>
  <div id="camera-error" class="camera-error" hidden>
    <p id="camera-error-text"></p>
    <button type="button" class="btn primary" data-camera="os-camera">端末のカメラアプリで撮る</button>
  </div>
  <div class="camera-bottom">
    <div class="camera-last-wrap"><img id="camera-last" class="camera-last" alt="最後に撮った写真" hidden></div>
    <button type="button" id="camera-shutter" class="shutter" data-camera="shoot" aria-label="撮影" disabled></button>
    <button type="button" class="camera-done" data-camera="done">完了</button>
  </div>
</div>

<input type="file" id="input-photos" accept="image/*" multiple hidden>
<input type="file" id="input-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="input-files" accept="application/pdf,.pdf,image/*" multiple hidden>

<dialog id="result-dialog" aria-labelledby="result-title">
  <div id="result-ready">
    <h2 id="result-title">PDFができました</h2>
    <p class="meta" id="result-meta"></p>
    <div class="actions">
      <button type="button" class="btn primary" data-action="share" id="share-button">送る・保存する</button>
      <button type="button" class="btn" data-action="download" id="download-button">ダウンロード</button>
      <button type="button" class="btn subtle" data-action="close-result">閉じる</button>
    </div>
  </div>
  <div id="result-done" class="done" hidden>
    <div class="done-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 id="done-title" tabindex="-1">完了しました</h2>
    <p class="meta" id="done-meta"></p>
    <div class="actions">
      <button type="button" class="btn primary" data-action="new-document">新しく作る</button>
      <button type="button" class="btn" data-action="close-result">このまま編集を続ける</button>
      <button type="button" class="btn subtle" data-action="back-to-result">もう一度 送る・保存する</button>
    </div>
  </div>
</dialog>

<div id="busy" class="busy" hidden role="alert" aria-busy="true"><div class="spinner"></div><p id="busy-text"></p></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="app-version" class="app-version"></div>
<div id="drop-overlay" class="drop-overlay" hidden>ここにドロップして追加</div>
<noscript><p style="padding:16px">RelaPDFを使うには、JavaScriptを有効にしてください。</p></noscript>
</body>
</html>
